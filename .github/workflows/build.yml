name: Build Plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Validate Plugins
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history (changelog generation)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run P2 checks
        run: npm run p2

      - name: Run P3 tests
        run: npm run test:p3

      - name: Build plugins
        run: npm run build

      - name: Verify build (drift gate)
        run: npm run verify

      - name: Run lint
        run: npm run lint

      - name: Run full check
        run: npm run check

      - name: Run all tests
        run: npm run test:all

  auto-release:
    name: Auto Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CHANGELOG
        run: npm run changelog

      - name: Update README stats
        run: npm run readme:stats

      - name: Commit changelog and stats updates
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add CHANGELOG.md README.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG and README stats for ${GITHUB_REF_NAME}"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Build plugins
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            plugins/**/*.json
            plugins/**/*.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run p2

      - name: Run tests
        run: npm run test:all

      - name: Run lint
        run: npm run lint

      - name: Run full check
        run: npm run check
