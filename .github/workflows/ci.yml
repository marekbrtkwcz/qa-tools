name: CI

on:
  push:
    branches: [main]
  pull_request:

# Parallel pushes to the same ref should queue, not multiply: keep the latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One workflow, two jobs, each gate once:
# - fast: zero-dependency gates on both OSes (the suite runs on plain node --test)
# - full: everything that needs node_modules (biome, tsc, P2 script tests)
# The former tag reaction lives in release.yml (single owner of v* tags).
jobs:
  fast:
    name: fast gates (zero-dep, ${{ matrix.os }})
    # The suite is fast (~10 s); a hung job should fail by timeout, not hold runners.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # windows-latest replicates a contributor on Windows (core.autocrlf=true);
        # the drift gate compares content with line endings normalized.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests (node:test, no dependencies)
        run: npm test

      - name: Validate membership, name rules and frontmatter limits (orphan skills/agents/knowledge)
        run: npm run check

      - name: Validate generated JSON manifests (plugin.json, mcp.json) and agent TOML syntax
        run: npm run validate-manifests

      - name: Drift gate - committed plugins/ must match a fresh build (orphan plugin dirs included)
        run: npm run verify

  full:
    name: full gates (lint, typecheck, P2, P3)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Runs in parallel with fast: independent signals, no waiting for the matrix.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome on scripts/ + pack lints)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: P2 checks (changelog preview, README stats, links - read-only)
        run: npm run p2

      - name: P3 script tests (validate-links, generate-changelog, update-readme-stats)
        run: npm run test:p3
