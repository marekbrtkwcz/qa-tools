name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Parallel pushes to the same ref should queue, not multiply: keep the latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: check + manifest validation + drift gate (${{ matrix.os }})
    # The suite is fast (~10 s); a hung job should fail by timeout, not hold runners.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # windows-latest replicates a contributor on Windows (core.autocrlf=true);
        # the drift gate compares content with line endings normalized.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests (node:test, no dependencies)
        run: npm test

      - name: Validate membership, name rules and frontmatter limits (orphan skills/agents/knowledge)
        run: npm run check

      - name: Validate generated JSON manifests (plugin.json, mcp.json) and agent TOML syntax
        run: npm run validate-manifests

      - name: Drift gate - committed plugins/ must match a fresh build (orphan plugin dirs included)
        run: npm run verify

  release-gate:
    # A v* tag is a release claim: the tag, every bundles.yaml version, the
    # CHANGELOG header and the repo package.json must agree before the tag
    # is trusted.
    name: tag = bundles.yaml versions = CHANGELOG header
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release consistency gate
        run: node scripts/check-release.ts --tag "${GITHUB_REF_NAME}"
