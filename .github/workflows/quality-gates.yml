name: Quality Gates

# Nightly only: full regression at rest. Push/PR gates live in ci.yml
# (one gate, one place); nightly adds what only makes sense on a schedule:
# security scan, flake detection across repeated runs and performance history.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: quality-gates-nightly
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  # Nightly full regression: the same gates the PR path runs, once a night,
  # on the tip of main.
  core-gates:
    name: Core gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: P2 checks (changelog preview, README stats, links)
        run: npm run p2

      - name: P3 unit tests
        run: npm run test:p3

      - name: Full test suite
        run: npm run test:all

      - name: Lint
        run: npm run lint

      - name: Full check
        run: npm run check

      - name: Drift gate
        run: npm run verify

  # P4.2: security scanning via the repo's own script (npm audit + secret
  # patterns + file permissions). Trufflehog stays as an advisory second
  # opinion: a skills collection legitimately contains example tokens in
  # fixtures, so its verdict is informational, not a gate.
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security scan (deps + secrets + permissions; exit 1 on findings)
        run: npm run security:scan

      - name: Trufflehog (advisory second opinion)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          filter: files
        continue-on-error: true

  # P4.3: flake detection - the npm script runs the suite 3x and exits 1 on
  # inconsistent results. A red nightly flake job is the signal.
  flaky-detection:
    name: Flaky test detection (3 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Flaky check
        run: npm run flaky:check

  # P4.4: performance history. benchmark:full measures the P2 scripts and
  # saves results (--runs 5 --save), which is the baseline perf:check compares
  # against later.
  performance:
    name: Performance benchmark (5 runs, save history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks and save history
        run: npm run benchmark:full
