name: Auto-release

# On every push to main: if the newest CHANGELOG entry has no matching
# git tag yet, create annotated tag v<version> and a GitHub Release
# with notes extracted from that CHANGELOG section.

on:
  push:
    branches: [main]

permissions:
  contents: write # push tag + create release

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to see existing tags

      - name: Read latest version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "No '## [x.y.z]' entry found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest CHANGELOG version: $VERSION"

      - name: Extract release notes for this version
        run: |
          awk -v start="## [${{ steps.version.outputs.version }}]" '
            index($0, start) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "qa-tools v${{ steps.version.outputs.version }}" > release-notes.md
          fi
          head -5 release-notes.md

      - name: Check if tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "qa-tools v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
          echo "Released v${{ steps.version.outputs.version }}"
