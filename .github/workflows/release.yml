name: Release

on:
  push:
    tags:
      - 'v*'

# Single owner of v* tags. The tag is a release claim, so every gate runs in
# this workflow (and gates each run once - no per-push duplication).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  validate-release:
    # A v* tag claims: tag = every bundles.yaml version = CHANGELOG header
    # = package.json. Versions are bumped BEFORE tagging (README: how to
    # release), so nothing is auto-bumped or auto-committed here.
    name: tag = bundles.yaml versions = CHANGELOG header
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Release consistency gate
        run: node scripts/check-release.ts --tag "${GITHUB_REF_NAME}"

  release:
    # All release gates in one job - all-or-nothing by design: a red gate
    # means no release, without hunting across jobs.
    name: gates + GitHub Release (plugins/ artifacts)
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full check (build --check, pack lints, CHANGELOG/README consistency, duplicates)
        run: npm run check

      - name: Validate generated manifests (plugin.json, mcp.json) and agent TOML syntax
        run: npm run validate-manifests

      - name: Build plugins (proves committed plugins/ matches a fresh build)
        run: npm run build

      - name: Drift gate - committed plugins/ must match the fresh build
        run: npm run verify

      - name: Unit tests (node:test)
        run: npm test

      - name: Script tests (P3)
        run: npm run test:p3

      - name: Lint (Biome on scripts/ + pack lints)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: README stats gate
        run: npm run readme:stats:check

      - name: CHANGELOG preview (the generator still parses history; hand-curated sections stay ours)
        run: npm run changelog:preview

      - name: Extract changelog section for this version
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION=${GITHUB_REF_NAME#v}
          CHANGELOG=$(node -e "
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const match = changelog.match(new RegExp(\\\"## \\\\[${VERSION}\\\\] - ([^\\\\n]+)\\\\n\\\\n((?:(?!## \\\\\\[).)*\\\\n*?)(?=## |$)\\\", 's'));
            process.stdout.write(match ? match[0].trim() : 'No changelog entry');
          ")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            plugins/**/*.json
            plugins/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
