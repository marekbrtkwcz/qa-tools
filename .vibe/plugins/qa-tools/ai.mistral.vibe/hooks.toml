# QA Tools — hooks
# Run automatically on relevant events in the user's project.

# After writing/editing a test file, run ESLint on it
[[hooks]]
name = "lint-test-file"
type = "post_tool"
match = "re:file_system\\.(write_file|edit)"
description = "Lint test files after they are written or edited"
command = """
payload=$(cat)
file_path=$(echo "$payload" | python -c "import sys,json; d=json.load(sys.stdin); ti=d.get('tool_input',{}); print(ti.get('path') or ti.get('file_path') or '')" 2>/dev/null)
case "$file_path" in
  *.spec.ts|*.test.ts|*.spec.js|*.test.js)
    if [ -f package.json ] && grep -q '"lint"' package.json 2>/dev/null; then
      npx eslint "$file_path" --no-error-on-unmatched-pattern 2>/dev/null || true
    fi
    ;;
esac
"""

# After writing/editing a spec file, verify it collects without running (syntax/structure check)
[[hooks]]
name = "playwright-list-spec"
type = "post_tool"
match = "re:file_system\\.(write_file|edit)"
description = "Run 'playwright test --list' on an edited spec file if playwright config exists"

command = """
payload=$(cat)
file_path=$(echo "$payload" | python -c "import sys,json; d=json.load(sys.stdin); ti=d.get('tool_input',{}); print(ti.get('path') or ti.get('file_path') or '')" 2>/dev/null)

case "$file_path" in
  *.spec.ts|*.test.ts|*.spec.js|*.test.js)
    if [ -f playwright.config.ts ] || [ -f playwright.config.js ] || [ -f playwright.config.mjs ]; then
      out=$(npx playwright test "$file_path" --list 2>&1) || true
      if echo "$out" | grep -qi 'error'; then
        echo "playwright-list-spec: błąd kolekcji $file_path:"
        echo "$out" | grep -i 'error' | head -10
      fi
    fi
    ;;
esac
exit 0
"""

# After the agent finishes a turn, type-check test files if TypeScript is present
[[hooks]]
name = "typecheck-after-agent"
type = "post_agent"
match = "main"
description = "Type-check after agent turn only when tests/*.ts files were touched; report error count"
command = """
payload=$(cat)
# run only when this turn wrote/edited a test or TS file (avoid running tsc on every turn)
if echo "$payload" | grep -qE '(tests/|\\.spec\\.ts|\\.test\\.ts|src/.*\\.ts)'; then
  if [ -f tsconfig.json ]; then
    out=$(npx tsc --noEmit 2>&1) || true
    n=$(echo "$out" | grep -c 'error TS' || true)
    if [ "$n" -gt 0 ]; then
      echo "typecheck-after-agent: $n błędów TS:"
      echo "$out" | grep 'error TS' | head -20
    fi
  fi
fi
exit 0
"""

# After a 'playwright test' run, report tests that only passed after a retry (flaky) from JUnit XML
[[hooks]]
name = "flaky-watch"
type = "post_tool"
match = "re:file_system\\.bash"
description = "After 'npx playwright test ...', parse JUnit XML and list flaky tests (passed only on retry)"

command = """
payload=$(cat)
cmd=$(echo "$payload" | python -c "import sys,json; d=json.load(sys.stdin); ti=d.get('tool_input',{}); print(ti.get('command') or '')" 2>/dev/null)

case "$cmd" in
  *"playwright test"*)
    for xml in results.xml test-results/junit.xml junit.xml; do
      [ -f "$xml" ] || continue
      python - "$xml" <<'PYEOF' 2>/dev/null || true
import sys, xml.etree.ElementTree as ET
tree = ET.parse(sys.argv[1])
flaky = []
for tc in tree.iter('testcase'):
    if tc.find('failure') is not None or tc.find('error') is not None:
        flaky.append(f"{tc.get('classname','')}::{tc.get('name','')}")
if flaky:
    print(f"flaky-watch: {len(flaky)} test(s) needed a retry:")
    for f in sorted(set(flaky)):
        print(" -", f)
PYEOF
      break
    done
    ;;
esac
exit 0
"""

# On session start, inject QA conventions context
[[hooks]]
name = "qa-conventions"
type = "session_start"
match = "startup"
description = "Add QA testing conventions as context on session start"
command = """
echo '{"hook_specific_output": {"additional_context": "QA conventions for this project: tests live in tests/ (e2e/, api/), use Playwright with getByRole/getByLabel selectors, always use expect() for assertions (never waitForTimeout), each test must be independent, clean up created data in afterEach. Run tests with: npx playwright test."}}'
"""
