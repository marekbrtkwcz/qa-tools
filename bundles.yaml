qa-mcp:
  icon: 🎭
  description: "QA MCP servers for qa-tools (browser: Playwright MCP + Chrome DevTools MCP; load testing: k6 MCP): install once alongside any automation bundle (test-automation, non-functional-testing, ui-api-automation, ui-api-automation-minimal) so browser control and load testing are never duplicated by multiple bundles."
  version: "0.7.0"
  # All three servers spawn global binaries and carry short, product-style
  # server names (playwright, chrome-devtools, k6) - deliberately NOT the
  # binary names (playwright-mcp, chrome-devtools-mcp; k6 is the one case
  # where short name and binary name are the same word): one uniform naming
  # convention for every MCP server in this repo and in user configs.
  # Shadowing still works: a user-level [[mcp_servers]] entry with the same
  # short name replaces the plugin copy (custom flags, longer timeouts)
  # instead of spawning a second instance. For k6 a user-level entry is the
  # expected setup, not a fallback: k6 tools run whole load tests and the
  # plugin manifest carries no tool timeout, so tool_timeout_sec for long
  # runs live only in a user-level entry. The install lines in README.md
  # ship floating (npm i -g ... @latest for the browser binaries, any OS;
  # for k6 one single-line command per supported OS - winget on Windows,
  # brew on macOS - while the multi-line Linux repo setup stays in the
  # official k6 install docs; version-controlled pins were dropped: the plugin manifest carries
  # only a bare command, so the version lives in the user's shared global
  # install anyway - pinning forced a downgrade on machines that already
  # run a newer binary). Build only enforces that the README keeps
  # documenting the install prerequisites (checkGlobalBinaryInstallDoc)
  # and that every declared server name has a known binary
  # (GLOBAL_BINARY_SERVERS).
  mcp:
    - playwright
    - chrome-devtools
    - k6

