qa-mcp:
  icon: 🎭
  description: "Playwright MCP server for qa-tools: install once alongside any automation bundle (test-automation, non-functional-testing, ui-api-automation, ui-api-automation-minimal) so browser control is never duplicated by multiple bundles."
  version: "0.2.0"
  mcp:
    - playwright

mobile-testing:
  icon: 📱
  description: "Mobile app test automation: Maestro-first flows with Appium as the deliberate fallback, stable selectors, deterministic device setup and CI device matrices."
  version: "0.2.0"
  skills:
    - mobile-app-testing
  agents:
    - mobile-test-automation-expert

orchestration-basics:
  icon: 🎼
  description: "Minimal orchestrator with three read-mostly helpers (planner, explorer, analyst): split analysis and planning across subagents to save context, with stop gates for the user."
  version: "0.2.0"
  pack: true
  skills:
    - orchestration-basics
  agents:
    - basics-planner
    - basics-explorer
    - basics-analyst
  knowledge:
    - orchestration-basics

plan-explore-review-commit:
  icon: 🔄
  description: "Full delivery pipeline: planner and orchestrator drive architect, researcher, explorer, implementer, QA strategy, security, code review and docs subagents through small test-first phases, with a user-approved commit after each."
  version: "0.2.0"
  pack: true
  skills:
