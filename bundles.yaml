# Bundles published to Vibe CLI as native Agent Plugins 1.0 packages.
# Adapted from https://github.com/jaktestowac/awesome-agents-for-quality (MIT).
# Each bundle is generated into plugins/<name>/ by scripts/build.js.

qa-core:
