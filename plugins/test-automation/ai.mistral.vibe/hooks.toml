[[hooks]]
name = "test-file-guard"
type = "pre_tool"
match = "file_system.write_file"
command = "node vibe-hooks/test-file-guard.js"
strict = false

[[hooks]]
name = "test-file-guard-edit"
type = "pre_tool"
match = "file_system.edit"
command = "node vibe-hooks/test-file-guard.js"
strict = false

[[hooks]]
name = "test-file-guard-bash"
type = "pre_tool"
match = "file_system.bash"
command = "node vibe-hooks/test-file-guard.js"
strict = false
